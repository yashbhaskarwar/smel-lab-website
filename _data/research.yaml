- id: traffic pollution
  title: Air Pollution from Heavy-Duty Vehicles
  image:
  summary: >
    We have explored real-world emissions from vocational heavy-duty vehicles across California. Our research has primarily focused on factors affecting NOx emissions, as well as particle emissions from heavy-duty vehicles.
    We have shown that disadvantaged communities living near warehouses and logistic centers, ports, and freight corridors are disproportionaly affected from heavy-vehicle emissions. Our work beyond primary emissions
    included investigations on the formation of secondary organic aerosol from natural gas and diesel-powered heavy-duty vehicles.