- id: Non-Exhaust Emissions
  title: Non-Exhaust Emissions from Mobile Sources
  image: images/Barge_boom_close.jpg
  summary: >
    We develop novel samping systems for onboard vehicle testing to measure brake-wear and tire and road wear particle and gaseous emissions from light-duty and commercial vehicles. 
    We study how brake pad material, tire type, road surface, and driving dynamics affect the formation of non-exhaust emissions. Our research examines airborne microplastic pollution released into the environment
    from tire-wear, along with other potentially toxic pollutants. We explore the formation of gaseous emissions from brake and tire wear and their effects on ozone forming potential and secondary aerosol production.
    My research is supported by the California Air Resources Board (CARB), South Coast Air Quality Management District (SCAQMD), the Center for Efficient Mobility,
    the National Center for Sustainavble Transportation (NCST), which is a U.S. Department of Transportation national University Transportation Center, and the automotive industry.  
