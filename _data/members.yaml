- id: troy-hurren
  name: Troy Hurren
  image: images/members/students/troy.jpg
  role: student
  group: students
  status: current
  email: troy.hurren@email.ucr.edu
  bio: >
    PhD candidate in Chemical and Environmental Engineering at the University of
    California, Riverside. Holds a BS in Mechanical Engineering from Mississippi
    State University and an MASc in Mechanical Engineering from the University of
    British Columbia. Research focuses on experimental emissions measurements and
    characterization for heavy-duty transportation, including engines, vehicles, and
    marine vessels, to support sustainable, science-informed policy.

- id: zixuan-gong
  name: Zixuan Gong
  image: images/members/students/zixuan.jpg
  role: student
  group: students
  status: current
  email: zixuan.gong@email.ucr.edu
  bio: >
    Holds an MSc in Advanced Chemical Engineering from Imperial College London and a
    BEng in Chemical Engineering from The University of Edinburgh through the
    SCUT–Edinburgh 2+2 Joint Program. Current research focuses on non-exhaust
    emissions from transportation sources, particularly brake and tire wear, with an
    emphasis on chemical analysis and characterization of particulate matter.

