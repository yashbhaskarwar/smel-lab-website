# Lab Director & Principal Investigator
# ---------------------------------------------------------------

- id: karavalakis
  name: Georgios Karavalakis
  image: images/members/pi/georgios.jpg
  role: pi
  group: faculty
  status: current
  bio: >
    Georgios Karavalakis is the W. Ruel Johnson Chair in Environmental Engineering and a Professor of Chemical and Environmental Engineering at the University of
    California, Riverside. Georgios is a Fellow of the Society of Automotive Engineers (SAE).
    His research interests are in combustion systems, emissions characterization and air quality, and climate and transportation. He run prjects on non-exhaust emission measurements from mobile sources,
    airborne microplastics pollution from tire-wear, and hydrogen and hydrogen blends with renewable natural gas for transportation engines and linear generators.
    Georgios is serving as the Director of the Non-Exhaust Emissions Consortium (NEEC) and as the Deputy Director of the Hydrogen Engine Alliance of North America.

